<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Automation Order Manager</title><link rel="stylesheet" href="/static/style.css"></head><body><main><header><div><p class="eyebrow">BUSINESS AUTOMATION</p><h1>Order Manager</h1><p>Rule-based order routing and workflow automation.</p></div><span class="badge">API ONLINE</span></header><section class="grid"><article><b>Standard</b><span>&lt; 300</span><small>Automatic confirmation</small></article><article><b>Priority</b><span>300–999</span><small>Priority confirmation</small></article><article><b>Manager Review</b><span>1000+</span><small>Sales alert + approval</small></article></section><section class="panel"><h2>Create order</h2><form id="f"><input id="customer" placeholder="Customer" required><input id="amount" type="number" min="0" step="0.01" placeholder="Amount" required><button>Create & automate</button></form><p id="result"></p></section><section class="panel"><div class="row"><h2>Recent orders</h2><button onclick="load()">Refresh</button></div><div id="orders"></div></section></main><script>async function load(){let r=await fetch('/api/orders'),d=await r.json();document.querySelector('#orders').innerHTML=d.length?d.map(x=>`<div class="order"><b>#${x.id} ${x.customer}</b><span>${Number(x.amount).toFixed(2)}</span><code>${x.action}</code><em>${x.status}</em></div>`).join(''):'<p>No orders yet.</p>'}document.querySelector('#f').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer:customer.value,amount:amount.value})}),d=await r.json();document.querySelector('#result').textContent=r.ok?`Automation triggered: ${d.action}`:(d.error||'Error');if(r.ok){e.target.reset();load()}};load()</script></body></html>
